<div class="modal fade" id="modalEmpleado" tabindex="-1">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<form id="frmEmpleado" method="POST">
<div class="modal-header">
<h5 id="tituloModal" class="modal-title">Empleado</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<div class="row">
<div class="col-md-4">
<label>Nombre</label>
<input id="nombre" name="nombre" class="form-control" required>
</div>
<div class="col-md-4">
<label>Apellido Paterno</label>
<input id="apellido_paterno" name="apellido_paterno" class="form-control" required>
</div>
<div class="col-md-4">
<label>Apellido Materno</label>
<input id="apellido_materno" name="apellido_materno" class="form-control">
</div>
<div class="col-md-4 mt-3">
<label>Puesto</label>
<input id="puesto" name="puesto" class="form-control" required>
</div>
<div class="col-md-4 mt-3">
<label>Teléfono</label>
<input id="telefono" name="telefono" class="form-control">
</div>
<div class="col-md-4 mt-3">
<label>Correo</label>
<input id="correo" name="correo" type="email" class="form-control">
</div>
</div>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
<button class="btn btn-success">Guardar</button>
</div>
</form>
</div></div></div>
