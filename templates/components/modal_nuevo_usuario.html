<div
    class="modal fade"
    id="modalNuevoUsuario"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <form
                id="frmNuevoUsuario"
                method="POST"
                action="{{ url_for('usuarios.nuevo_usuario') }}"
            >

                <div class="modal-header bg-success text-white">

                    <h5 class="modal-title">

                        <i class="fas fa-user-plus"></i>

                        Nuevo Usuario

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">

                            Usuario

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="usuario"
                            maxlength="30"
                            autocomplete="off"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Nombre completo

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="nombre"
                            maxlength="100"
                            autocomplete="off"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Rol

                        </label>

                        <select
                            class="form-select"
                            name="rol"
                            required
                        >

                            <option value="Administrador">

                                Administrador

                            </option>

                            <option value="Empleado">

                                Empleado

                            </option>

                        </select>

                    </div>

                    <div class="alert alert-info mb-0">

                        <i class="fas fa-circle-info"></i>

                        El sistema generará automáticamente una contraseña
                        temporal y el usuario deberá cambiarla al iniciar
                        sesión por primera vez.

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="fas fa-save"></i>

                        Guardar Usuario

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
