{% extends "base.html" %}

{% block title %}
Cambiar contraseña
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">

                        Cambiar contraseña

                    </h4>

                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        action="{{ url_for('auth.cambiar_password') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">

                                Contraseña actual

                            </label>

                            <input
                                type="password"
                                name="actual"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Nueva contraseña

                            </label>

                            <input
                                type="password"
                                name="nueva"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Confirmar nueva contraseña

                            </label>

                            <input
                                type="password"
                                name="confirmar"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>

                        <div
                            class="d-flex justify-content-between"
                        >

                            <a
                                href="{{ url_for('dashboard') }}"
                                class="btn btn-secondary"
                            >

                                Cancelar

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >

                                Guardar contraseña

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
