{% extends "base.html" %}

{% block title %}Nueva Actividad{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4>Nueva Actividad</h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Actividad

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="actividad"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Descripción

                    </label>

                    <textarea
                        class="form-control"
                        name="descripcion"
                        rows="4"
                    ></textarea>

                </div>

                <button
                    class="btn btn-success"
                    type="submit"
                >

                    Iniciar Actividad

                </button>

                <a
                    href="{{ url_for('actividades.lista') }}"
                    class="btn btn-secondary"
                >

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
